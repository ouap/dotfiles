name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: shellcheck, zsh -n, install.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and zsh
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: Run tests
        run: bash tests/run.sh
